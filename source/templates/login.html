<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - University Records System</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: #fff; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); width: 100%; max-width: 380px; }
        h1 { font-size: 1.35rem; margin: 0 0 0.5rem; color: #1f2937; }
        p.subtitle { color: #6b7280; font-size: 0.9rem; margin: 0 0 1.5rem; }
        label { display: block; margin-bottom: 0.35rem; font-weight: 600; font-size: 0.9rem; color: #374151; }
        input[type="text"], input[type="password"] { width: 100%; padding: 0.6rem; margin-bottom: 1rem; border: 1px solid #d1d5db; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 0.7rem; background: #2563eb; color: #fff; border: none; border-radius: 6px; font-size: 1rem; font-weight: 600; cursor: pointer; }
        button:hover { background: #1d4ed8; }
        .alert-error { background: #fee2e2; color: #991b1b; padding: 0.75rem; border-radius: 6px; margin-bottom: 1rem; font-size: 0.9rem; }
        .alert-info { background: #dbeafe; color: #1e40af; padding: 0.75rem; border-radius: 6px; margin-bottom: 1rem; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="card">
        <h1>University Records System</h1>
        <p class="subtitle">Sign in with your university account</p>

        {% if error %}
        <div class="alert-error">{{ error }}</div>
        {% endif %}

        {% if message %}
        <div class="alert-info">{{ message }}</div>
        {% endif %}

        <form method="post" action="/login">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required autocomplete="username">

            <label for="password">Password</label>
            <input type="password" id="password" name="password" required autocomplete="current-password">

            <button type="submit">Sign In</button>
        </form>
    </div>
</body>
</html>
